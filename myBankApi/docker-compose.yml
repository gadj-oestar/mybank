version: '3.8'

services:
  # 🐬 Base de données MySQL
  database:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mybank
      MYSQL_USER: symfony
      MYSQL_PASSWORD: symfony
    ports:
      - "3306:3306"  # Attention: si tu as déjà MySQL en local, change à "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  # 🐘 Conteneur PHP pour Symfony
  php:
    build: .
    container_name: mybank_php
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    depends_on:
      - database
    ports:
      - "8000:8000" # Symfony server sur localhost:8000
    command: >
      bash -c "composer install &&
               php bin/console doctrine:database:create --if-not-exists &&
               php bin/console doctrine:migrations:migrate --no-interaction &&
               symfony serve --no-tls --port=8000 --ansi"

volumes:
  db_data:
