name: MyBank CI/CD

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  # 1. Intégration Continue (tests)
  build-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mybank_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v3

      - name: ⚙️ Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, pdo_mysql, intl
          coverage: none

      - name: 📦 Installer Composer
        run: composer install --no-progress --no-suggest --prefer-dist

      - name: 📂 Configurer la base de données test
        run: |
          php bin/console doctrine:database:create --env=test
          php bin/console doctrine:migrations:migrate --env=test --no-interaction

      - name: 🧪 Lancer les tests PHPUnit
        run: vendor/bin/phpunit --testdox

  # 2. Déploiement Continu (prod)
  deploy:
    runs-on: ubuntu-latest
    needs: build-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v3

      - name: 🚀 Déployer sur le serveur
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/mybank
            git pull origin main
            ./deploy.sh
